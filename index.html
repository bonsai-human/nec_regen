<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="ターン制ヘクス戦術シミュレーション" />
    <title>ヘクス戦術シミュレーション</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="app__bar">
        <span class="app__title">ヘクス戦術シミュレーション</span>
        <span id="turn-label" class="app__turn"></span>
        <span id="map-name" class="app__phase"></span>
      </header>
      <main id="stage" class="app__stage">
        <canvas id="board" class="app__canvas"></canvas>
      </main>
      <footer class="app__panel">
        <p id="readout" class="app__readout">読み込み中…</p>
        <div class="app__controls">
          <button id="confirm" class="btn btn--primary" type="button" hidden>確定</button>
          <button id="capture" class="btn" type="button" hidden>占領</button>
          <button id="store" class="btn" type="button" hidden>格納</button>
          <button id="deploy" class="btn" type="button" hidden>次の中身</button>
          <button id="wait" class="btn" type="button" hidden>待機</button>
          <button id="cancel" class="btn" type="button" hidden>取消</button>
          <button id="undo" class="btn" type="button" hidden>元に戻す</button>
          <button id="end-turn" class="btn" type="button">ターン終了</button>
          <button id="zoom-out" class="btn" type="button" aria-label="縮小">−</button>
          <button id="zoom-fit" class="btn" type="button" aria-label="全体表示">全体</button>
          <button id="zoom-in" class="btn" type="button" aria-label="拡大">＋</button>
        </div>
      </footer>
      <div id="result" class="result" hidden>
        <div class="result__box">
          <p id="result-text" class="result__text"></p>
          <button id="restart" class="btn btn--primary" type="button">最初から</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
